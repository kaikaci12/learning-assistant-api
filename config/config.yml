models:
  - type: main
    engine: openai
    model: openrouter/free
    parameters:
      base_url: "https://openrouter.ai/api/v1"

rails:
  input:
    flows:
      - self check input
      - jailbreak detection heuristics

tracing:
  enabled: true
  adapters:
    - name: FileSystem
      filepath: "./logs/traces.jsonl"
passthrough: true
